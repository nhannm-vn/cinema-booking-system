name: cinema_booking_app
description: "Cinema Booking & Operation Management Application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Design, Typography & Icons
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^3.1.25

  # Firebase Core & Services
  firebase_core: ^2.30.0
  firebase_auth: ^4.19.0
  cloud_firestore: ^4.17.0

  # State Management
  provider: ^6.1.2

  # Formatters & Helpers
  intl: ^0.19.0
  crypto: ^3.0.3

  # Camera & QR Codes
  mobile_scanner: ^5.1.0
  qr_flutter: ^4.1.0

  # Map & Location
  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0

  # Payment WebView
  webview_flutter: ^4.7.0

  # Notifications & Local Storage
  flutter_local_notifications: ^17.1.0
  shared_preferences: ^2.2.3

  # Media & Utilities
  cached_network_image: ^3.3.1
  url_launcher: ^6.2.5
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
